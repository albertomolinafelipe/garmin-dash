table:
  name: plans
  schema: public
array_relationships:
  - name: requirements
    using:
      foreign_key_constraint_on:
        column: plan_id
        table:
          name: plan_requirements
          schema: public
  - name: workouts
    using:
      foreign_key_constraint_on:
        column: plan_id
        table:
          name: plan_workouts
          schema: public
select_permissions:
  - role: user
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: user
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter: {}
