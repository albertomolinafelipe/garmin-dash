table:
  name: shoes
  schema: public
object_relationships:
  - name: shoe_sport
    using:
      foreign_key_constraint_on: sport
array_relationships:
  - name: activities
    using:
      foreign_key_constraint_on:
        column: shoe_id
        table:
          name: activities
          schema: public
select_permissions:
  - role: user
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: user
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter: {}
