table:
  name: activities
  schema: public
object_relationships:
  # Grade adjusted pace ratio; a materialized view, so joined by hand.
  - name: gap
    using:
      manual_configuration:
        column_mapping:
          id: activity_id
        insertion_order: null
        remote_table:
          name: activity_gap
          schema: public
  - name: shoe
    using:
      foreign_key_constraint_on: shoe_id
array_relationships:
  - name: activity_streams
    using:
      foreign_key_constraint_on:
        column: activity_id
        table:
          name: activity_streams
          schema: public
select_permissions:
  - role: user
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: user
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter: {}
