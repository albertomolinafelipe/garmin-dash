[global]

# Public ondra Run service URL; consumed by the remote schema (url_from_env).
[[global.environment]]
name = 'ONDRA_GRAPHQL_URL'
value = '{{ secrets.ONDRA_GRAPHQL_URL }}'

# Shared secret Hasura forwards to ondra (remote schema header value_from_env).
[[global.environment]]
name = 'ONDRA_REMOTE_SCHEMA_SECRET'
value = '{{ secrets.ONDRA_REMOTE_SCHEMA_SECRET }}'

[hasura]
version = 'v2.48.10-ce'
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'
webhookSecret = '{{ secrets.NHOST_WEBHOOK_SECRET }}'

[[hasura.jwtSecrets]]
type = 'RS256'
key = '{{ secrets.NHOST_JWT_PUBLIC_KEY }}'
signingKey = '{{ secrets.NHOST_JWT_PRIVATE_KEY }}'
kid = '{{ secrets.NHOST_JWT_KID }}'

[hasura.settings]
corsDomain = ['*']
devMode = true
enableAllowList = false
enableConsole = true
enableRemoteSchemaPermissions = false
enabledAPIs = ['metadata', 'graphql', 'pgdump', 'config']
inferFunctionPermissions = true
liveQueriesMultiplexedRefetchInterval = 1000
stringifyNumericTypes = false

[hasura.logs]
level = 'warn'

[hasura.events]
httpPoolSize = 100

# Email OTP is available only to users created by an administrator.
[auth]
version = '0.49.1'

[auth.signUp]
enabled = false
disableNewUsers = true

[auth.method]
[auth.method.otp]
[auth.method.otp.email]
enabled = true

[postgres]
version = '15.12-20250530-1'

[postgres.resources]
[postgres.resources.storage]
capacity = 1

[provider]

[observability]
[observability.grafana]
adminPassword = '{{ secrets.GRAFANA_ADMIN_PASSWORD }}'

[observability.grafana.alerting]
enabled = false
