query WeekNotes {
  week_notes(order_by: {week: asc}) {
    week
    note
  }
}

mutation UpsertWeekNote($object: week_notes_insert_input!) {
  insert_week_notes_one(
    object: $object
    on_conflict: {constraint: week_notes_pkey, update_columns: [note]}
  ) {
    week
  }
}

mutation DeleteWeekNote($week: String!) {
  delete_week_notes_by_pk(week: $week) {
    week
  }
}

